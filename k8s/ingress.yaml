apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobhunter-ingress
  namespace: job-hunter
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.jobhunterai.com
    secretName: jobhunter-tls
  rules:
  - host: api.jobhunterai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: job-hunter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ewiabeng23/job-hunter-backend:latest
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          value: "postgresql://jobhunter_user:YOUR_DB_PASSWORD@postgres-service:5432/jobhunter"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobhunter-secrets
              key: ANTHROPIC_API_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jobhunter-secrets
              key: SECRET_KEY
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: jobhunter-config
              key: ENVIRONMENT
        livenessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: job-hunter
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8001
  type: LoadBalancer

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: job-hunter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ewiabeng23/job-hunter-backend:latest
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: jobhunter-secrets
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jobhunter-secrets
              key: DATABASE_PASSWORD
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: jobhunter-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: jobhunter-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: jobhunter-config
              key: DATABASE_NAME
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobhunter-secrets
              key: ANTHROPIC_API_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jobhunter-secrets
              key: SECRET_KEY
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: jobhunter-config
              key: ENVIRONMENT
        livenessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: job-hunter
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8001
  type: LoadBalancer

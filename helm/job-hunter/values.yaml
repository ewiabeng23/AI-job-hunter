# Namespace
namespace: job-hunter

# Backend configuration
backend:
  image:
    repository: ewiabeng23/job-hunter-backend
    tag: latest
    pullPolicy: Always
  replicas: 2
  port: 8001
  env:
    databaseUrl: "postgresql://jobhunter_user:secure_password_123@postgres-service:5432/jobhunter"
    secretKey: "REPLACE_WITH_REAL_SECRET"
    anthropicApiKey: "REPLACE_WITH_REAL_KEY"

# Frontend configuration
frontend:
  image:
    repository: ewiabeng23/job-hunter-frontend
    tag: latest
    pullPolicy: Always
  replicas: 2
  port: 80

# PostgreSQL configuration
postgres:
  image:
    repository: postgres
    tag: "16"
  replicas: 1
  port: 5432
  database: jobhunter
  user: jobhunter_user
  password: secure_password_123
  storage: 5Gi

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  nodePort: 31678

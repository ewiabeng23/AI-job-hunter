apiVersion: v1
kind: Secret
metadata:
  name: jobhunter-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.postgres.user | quote }}
  DATABASE_PASSWORD: {{ .Values.postgres.password | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
